name: Deploy

# Runs on every push to the production branch, or manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------
  # 1. Validate all PHP files
  # ----------------------------------------------------------
  validate:
    name: Validate PHP syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint all PHP files
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done

  # ----------------------------------------------------------
  # 2. Integration test against a real MySQL service container
  #    (starts PHP's dev server + imports schema.sql)
  # ----------------------------------------------------------
  integration:
    name: Integration test
    runs-on: ubuntu-latest
    needs: validate
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: steakhouse_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql

      - name: Wait for MySQL
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mysql-client
          for i in {1..20}; do
            if mysqladmin ping -h 127.0.0.1 -u root --silent; then echo "MySQL is up"; break; fi
            sleep 2
          done

      # schema.sql is database-agnostic (no CREATE/USE). The MySQL service
      # container creates `steakhouse_test` (see MYSQL_DATABASE above), so we
      # import into it directly. CI never touches the Aiven production DB.
      - name: Import schema
        env:
          MYSQL_PWD: ""
        run: |
          mysql -h 127.0.0.1 -u root steakhouse_test < database/schema.sql
          mysql -h 127.0.0.1 -u root steakhouse_test -e "SHOW TABLES;"

      - name: Configure app env
        run: |
          printf 'APP_ENV=test\nDB_HOST=127.0.0.1\nDB_PORT=3306\nDB_NAME=steakhouse_test\nDB_USER=root\nDB_PASSWORD=\nADMIN_API_TOKEN=ci-token\n' > .env

      - name: Smoke test API
        run: |
          set -e
          php -S 127.0.0.1:8000 -t . >/tmp/php-server.log 2>&1 &
          SERVER_PID=$!
          sleep 2

          echo "== menu =="
          curl -fsS http://127.0.0.1:8000/api/menu/list.php | grep -q '"success":true'

          echo "== reservation (valid) =="
          DATE=$(date -d "+3 days" +%F)
          curl -fsS -X POST http://127.0.0.1:8000/api/reservations/create.php \
            -H "Content-Type: application/json" \
            -d "{\"customer_name\":\"CI Test\",\"phone\":\"01154053377\",\"email\":\"ci@example.com\",\"reservation_date\":\"${DATE}\",\"reservation_time\":\"11:00\",\"guests\":2,\"message\":\"integration\"}" \
            | grep -q '"success":true'

          echo "== reservation (invalid -> 422) =="
          curl -s -o /dev/null -w "%{http_code}\n" -X POST \
            http://127.0.0.1:8000/api/reservations/create.php \
            -H "Content-Type: application/json" \
            -d '{"customer_name":"","phone":"1","email":"x","reservation_date":"2000-01-01","reservation_time":"23:00","guests":99}' \
            | grep -q 422

          echo "== contact =="
          curl -fsS -X POST http://127.0.0.1:8000/api/contact/create.php \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Test","email":"ci@example.com","subject":"Test","message":"Hello from CI"}' \
            | grep -q '"success":true'

          echo "== reservations list (401, no token) =="
          curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8000/api/reservations/list.php | grep -q 401

          echo "== reservations list (401, wrong token) =="
          curl -s -o /dev/null -w "%{http_code}\n" -H "Authorization: Bearer wrong-token" http://127.0.0.1:8000/api/reservations/list.php | grep -q 401

          echo "== reservations list (200, correct Bearer) =="
          curl -s -o /dev/null -w "%{http_code}\n" -H "Authorization: Bearer ci-token" http://127.0.0.1:8000/api/reservations/list.php | grep -q 200

          echo "== reservations list (200, correct query token) =="
          curl -s -o /dev/null -w "%{http_code}\n" "http://127.0.0.1:8000/api/reservations/list.php?token=ci-token" | grep -q 200

          echo "== TLS fail-closed (no credential leak) =="
          DB_SSL=true DB_SSL_CA=/tmp/does-not-exist.pem php -S 127.0.0.1:8001 -t . >/tmp/php-server-tls.log 2>&1 &
          TLS_PID=$!
          sleep 1
          CODE=$(curl -s -o /tmp/tls-body.txt -w "%{http_code}" http://127.0.0.1:8001/api/menu/list.php)
          if [ "$CODE" != "500" ]; then
            echo "FAIL: expected 500 when TLS CA is missing, got $CODE"; exit 1
          fi
          if grep -qiE 'aiven|AVNS_|password|ca certificate' /tmp/tls-body.txt; then
            echo "FAIL: TLS failure leaked detail to the client"; exit 1
          fi
          kill "$TLS_PID" 2>/dev/null || true

          kill "$SERVER_PID" 2>/dev/null || true
          echo "All integration checks passed."

  # ----------------------------------------------------------
  # 3. Trigger deployment on Render
  # ----------------------------------------------------------
  deploy:
    name: Trigger Render deployment
    runs-on: ubuntu-latest
    needs: [validate, integration]
    if: success()
    steps:
      - name: Call Render deploy hook
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          # Created in GitHub settings -> Secrets and variables -> Actions
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl -f -X POST "$RENDER_DEPLOY_HOOK"
          echo "Deployment triggered on Render."