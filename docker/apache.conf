# Steakhouse Apache virtual host.
# ${PORT} is replaced with the real value by docker/entrypoint.sh
# before Apache starts (Render injects $PORT; locally the default
# configured below is 8080).

Listen ${PORT}

<VirtualHost *:${PORT}>
    ServerName localhost

    # Apache does not always expose the Authorization header to PHP as
    # $_SERVER['HTTP_AUTHORIZATION']; copy it into an env var PHP can see.
    <IfModule mod_setenvif.c>
        SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    </IfModule>

    DocumentRoot "/var/www/html"

    <Directory "/var/www/html">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>